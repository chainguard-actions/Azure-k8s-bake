name: Test helm render engine with arguments input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: bake
        uses: .
        with:
          renderEngine: helm
          helmChart: ${{ github.workspace }}/tests/fixtures/Helm/HelmCharts
          overrideFiles: ${{ github.workspace }}/tests/fixtures/Helm/values.yaml
          releaseName: test-release-args
          namespace: test-namespace
          helm-version: 'v3.17.0'
          arguments: '--set serviceName=custom-service'

      - name: Assert manifestsBundle output is set
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "manifestsBundle: $BUNDLE"
          if [ -z "$BUNDLE" ]; then
            echo "FAIL: manifestsBundle output is empty"
            exit 1
          fi
          echo "PASS: manifestsBundle is set to '$BUNDLE'"

      - name: Assert manifest bundle file exists
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Checking bundle path: $BUNDLE"
          if [ ! -f "$BUNDLE" ]; then
            echo "FAIL: manifest bundle file does not exist at '$BUNDLE'"
            exit 1
          fi
          echo "PASS: manifest bundle file exists"

      - name: Assert manifest bundle contains overridden value from arguments
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Bundle contents:"
          cat "$BUNDLE"
          if ! grep -q "custom-service" "$BUNDLE"; then
            echo "FAIL: manifest bundle does not contain the value set via --set argument 'custom-service'"
            exit 1
          fi
          echo "PASS: manifest bundle contains value set via arguments input"
