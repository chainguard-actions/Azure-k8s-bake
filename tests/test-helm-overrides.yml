name: Test helm render engine with overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare runner directories
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/runner-tool-cache

      - id: bake
        uses: .
        with:
          renderEngine: helm
          helmChart: ${{ github.workspace }}/testResources/Helm/HelmCharts
          releaseName: custom-release
          namespace: production
          overrideFiles: ${{ github.workspace }}/testResources/Helm/values.yaml
          overrides: |
            image.tag:v2.0
          helm-version: 'v3.17.3'

      - name: Assert manifestsBundle output is set
        env:
          MANIFESTS_BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "manifestsBundle: $MANIFESTS_BUNDLE"
          if [ -z "$MANIFESTS_BUNDLE" ]; then
            echo "FAIL: manifestsBundle output is empty"
            exit 1
          fi
          echo "PASS: manifestsBundle is set"

      - name: Assert manifest bundle file exists
        env:
          MANIFESTS_BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Checking manifest bundle at: $MANIFESTS_BUNDLE"
          if [ ! -f "$MANIFESTS_BUNDLE" ]; then
            echo "FAIL: manifest bundle file does not exist at $MANIFESTS_BUNDLE"
            exit 1
          fi
          echo "PASS: manifest bundle file exists"

      - name: Assert manifest bundle contains expected release name
        env:
          MANIFESTS_BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Contents of manifest bundle:"
          cat "$MANIFESTS_BUNDLE"
          if ! grep -q "custom-release" "$MANIFESTS_BUNDLE"; then
            echo "FAIL: manifest bundle does not contain release name 'custom-release'"
            exit 1
          fi
          echo "PASS: manifest bundle contains expected release name"

      - name: Assert manifest bundle contains Service resource
        env:
          MANIFESTS_BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          if ! grep -q "kind: Service" "$MANIFESTS_BUNDLE"; then
            echo "FAIL: manifest bundle does not contain a Service resource"
            exit 1
          fi
          echo "PASS: manifest bundle contains Service resource"
