name: Test helm render engine with overrides
on:
  workflow_dispatch:
jobs:
  test-helm-overrides:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/tool-cache
      AGENT_TOOLSDIRECTORY: /tmp/tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare directories and copy helm chart to writable location
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/tool-cache
          # Copy helm chart to a writable temp location so helm dependency update can write to it
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/helm-chart" /tmp/helm-chart-overrides
          chmod -R 755 /tmp/helm-chart-overrides

      - id: bake
        uses: .
        with:
          renderEngine: helm
          helmChart: /tmp/helm-chart-overrides
          releaseName: override-release
          namespace: override-ns
          overrides: |
            title:My Custom Title
            serviceType:NodePort
          helm-version: 'v3.16.4'

      - name: Assert manifestsBundle output is set
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "manifestsBundle: $BUNDLE"
          if [ -z "$BUNDLE" ]; then
            echo "FAIL: manifestsBundle output is empty"
            exit 1
          fi
          echo "PASS: manifestsBundle is set to $BUNDLE"

      - name: Assert manifest bundle file exists
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Checking bundle file: $BUNDLE"
          if [ ! -f "$BUNDLE" ]; then
            echo "FAIL: manifest bundle file does not exist at $BUNDLE"
            exit 1
          fi
          echo "PASS: manifest bundle file exists"

      - name: Assert manifest bundle contains override release name
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Checking bundle content..."
          cat "$BUNDLE"
          if ! grep -q "override-release" "$BUNDLE"; then
            echo "FAIL: manifest bundle does not contain release name 'override-release'"
            exit 1
          fi
          echo "PASS: manifest bundle contains override release name"

      - name: Assert manifest bundle contains override namespace
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          if ! grep -q "override-ns" "$BUNDLE"; then
            echo "FAIL: manifest bundle does not contain namespace 'override-ns'"
            exit 1
          fi
          echo "PASS: manifest bundle contains override namespace"
