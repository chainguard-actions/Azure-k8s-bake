name: Test helm render engine with overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: bake
        uses: .
        with:
          renderEngine: helm
          helmChart: ${{ github.workspace }}/tests/fixtures/Helm/HelmCharts
          releaseName: override-release
          namespace: override-ns
          helm-version: 'v3.17.0'
          overrides: |
            title:My Custom Title
            serviceName:custom-service
            serviceType:ClusterIP

      - name: Assert manifestsBundle output is set
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "manifestsBundle: $BUNDLE"
          if [ -z "$BUNDLE" ]; then
            echo "FAIL: manifestsBundle output is empty"
            exit 1
          fi
          echo "PASS: manifestsBundle is set to '$BUNDLE'"

      - name: Assert manifest bundle file exists
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Checking bundle path: $BUNDLE"
          if [ ! -f "$BUNDLE" ]; then
            echo "FAIL: manifest bundle file does not exist at '$BUNDLE'"
            exit 1
          fi
          echo "PASS: manifest bundle file exists"

      - name: Assert manifest bundle contains overridden values
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Bundle contents:"
          cat "$BUNDLE"
          if ! grep -q "override-release" "$BUNDLE"; then
            echo "FAIL: manifest bundle does not contain the release name 'override-release'"
            exit 1
          fi
          if ! grep -q "override-ns" "$BUNDLE"; then
            echo "FAIL: manifest bundle does not contain the namespace 'override-ns'"
            exit 1
          fi
          echo "PASS: manifest bundle contains expected overridden values"
