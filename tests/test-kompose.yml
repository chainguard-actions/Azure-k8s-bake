name: Test kompose render engine
on:
  workflow_dispatch:
jobs:
  test-kompose:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/tool-cache
      AGENT_TOOLSDIRECTORY: /tmp/tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare directories
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/tool-cache

      - id: bake
        uses: .
        with:
          renderEngine: kompose
          dockerComposeFile: ${{ github.workspace }}/tests/fixtures/kompose/docker-compose.yml
          kompose-version: 'v1.37.0'

      - name: Assert manifestsBundle output is set
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "manifestsBundle: $BUNDLE"
          if [ -z "$BUNDLE" ]; then
            echo "FAIL: manifestsBundle output is empty"
            exit 1
          fi
          echo "PASS: manifestsBundle is set to $BUNDLE"

      - name: Assert manifest bundle file exists
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Checking bundle file: $BUNDLE"
          if [ ! -f "$BUNDLE" ]; then
            echo "FAIL: manifest bundle file does not exist at $BUNDLE"
            exit 1
          fi
          echo "PASS: manifest bundle file exists"

      - name: Assert manifest bundle contains Service or Deployment
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Checking bundle content..."
          cat "$BUNDLE"
          if ! grep -qE "kind: (Service|Deployment)" "$BUNDLE"; then
            echo "FAIL: manifest bundle does not contain a Service or Deployment"
            exit 1
          fi
          echo "PASS: manifest bundle contains kubernetes resources"

      - name: Assert manifest bundle contains frontend service
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          if ! grep -qi "frontend" "$BUNDLE"; then
            echo "FAIL: manifest bundle does not contain 'frontend'"
            exit 1
          fi
          echo "PASS: manifest bundle contains frontend"
