name: Test kompose render engine
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare runner directories
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/runner-tool-cache

      - id: bake
        uses: .
        with:
          renderEngine: kompose
          dockerComposeFile: ${{ github.workspace }}/testResources/Kompose/docker-compose.yml
          kompose-version: 'v1.31.2'
          silent: 'true'

      - name: Assert manifestsBundle output is set
        env:
          ACTUAL: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: manifestsBundle output is empty"
            exit 1
          fi
          echo "PASS: manifestsBundle is set to $ACTUAL"

      - name: Assert manifest bundle file exists
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "bundle path: $BUNDLE"
          if [ ! -f "$BUNDLE" ]; then
            echo "FAIL: manifest bundle file does not exist at $BUNDLE"
            exit 1
          fi
          echo "PASS: manifest bundle file exists"

      - name: Assert manifest bundle contains expected resource
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "Checking manifest content..."
          cat "$BUNDLE"
          if ! grep -qiE "kind: (Deployment|Service)" "$BUNDLE"; then
            echo "FAIL: manifest bundle does not contain a Deployment or Service resource"
            exit 1
          fi
          echo "PASS: manifest bundle contains expected Kubernetes resources"
