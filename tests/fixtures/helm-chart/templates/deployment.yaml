apiVersion: apps/v1
kind: Deployment
metadata:
   name: aks-helloworld-{{.Release.Name}}
   namespace: {{.Release.Namespace}}
spec:
   replicas: 1
   selector:
      matchLabels:
         app: aks-helloworld-{{.Release.Name}}
   template:
      metadata:
         labels:
            app: aks-helloworld-{{.Release.Name}}
      spec:
         containers:
            - name: aks-helloworld-{{.Release.Name}}
              image: neilpeterson/aks-helloworld:v1
              ports:
                 - containerPort: 80
              env:
                 - name: TITLE
                   value: {{.Values.title}}
---
apiVersion: v1
kind: Service
metadata:
   name: {{.Values.serviceName}}
   namespace: {{.Release.Namespace}}
spec:
   type: {{.Values.serviceType}}
   ports:
      - port: 80
   selector:
      app: aks-helloworld-{{.Release.Name}}
