name: Test helm with silent input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal helm chart for testing
        run: |
          mkdir -p /tmp/test-chart-silent/templates
          cat > /tmp/test-chart-silent/Chart.yaml <<'EOF'
          apiVersion: v2
          name: test-chart-silent
          description: A test chart for silent mode
          type: application
          version: 0.1.0
          appVersion: "1.0.0"
          EOF
          cat > /tmp/test-chart-silent/values.yaml <<'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          EOF
          cat > /tmp/test-chart-silent/templates/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ .Release.Name }}-deployment
            namespace: {{ .Release.Namespace | default "default" }}
          spec:
            replicas: {{ .Values.replicaCount }}
            selector:
              matchLabels:
                app: {{ .Release.Name }}
            template:
              metadata:
                labels:
                  app: {{ .Release.Name }}
              spec:
                containers:
                  - name: nginx
                    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          EOF

      - id: bake
        uses: .
        with:
          renderEngine: helm
          helmChart: /tmp/test-chart-silent
          releaseName: silent-release
          silent: 'true'

      - name: Assert manifestsBundle output is set
        env:
          ACTUAL: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: manifestsBundle output is empty"
            exit 1
          fi
          echo "PASS: manifestsBundle is set to $ACTUAL"

      - name: Assert manifest file exists and contains expected content
        env:
          BUNDLE: ${{ steps.bake.outputs.manifestsBundle }}
        run: |
          echo "bundle path: $BUNDLE"
          if [ ! -f "$BUNDLE" ]; then
            echo "FAIL: manifest bundle file does not exist at $BUNDLE"
            exit 1
          fi
          echo "--- Manifest contents ---"
          cat "$BUNDLE"
          echo "--- End of manifest ---"
          if ! grep -q "Deployment" "$BUNDLE"; then
            echo "FAIL: manifest does not contain expected Deployment resource"
            exit 1
          fi
          echo "PASS: manifest file exists and contains Deployment (silent mode worked)"
